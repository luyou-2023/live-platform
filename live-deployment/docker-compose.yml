name: live-platform

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: live_platform
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit/livekit.yaml --dev
    ports:
      - "7880:7880"     # HTTP API / 信令
      - "7881:7881"     # WebSocket 备用信令
      - "7882:7882/udp" # WebRTC 媒体（rtc.node_ip=127.0.0.1）
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml
    depends_on:
      - redis

  # RTMP 推流入口（OBS 推流经此进入直播房间）
  ingress:
    image: livekit/ingress:latest
    command: --config /etc/livekit-ingress/ingress.yaml
    ports:
      - "19350:1935"    # RTMP（宿主 1935 被本机其他进程占用，映射到 19350）
      - "8088:8088"     # WHIP（OBS WebRTC 推流）
    volumes:
      - ./ingress.yaml:/etc/livekit-ingress/ingress.yaml
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "livekit,redis,localhost,127.0.0.1"
      no_proxy: "livekit,redis,localhost,127.0.0.1"
    depends_on:
      - livekit
      - redis

volumes:
  mysql-data:
