name: live-platform

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: live_platform
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit/livekit.yaml --dev
    ports:
      - "7880:7880"     # HTTP API / 信令
      - "7881:7881"     # WebSocket 备用信令
      - "7882:7882/udp" # WebRTC 媒体（rtc.node_ip=127.0.0.1）
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml

volumes:
  mysql-data:
